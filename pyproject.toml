[project]
name = "adaptive-forecast-agent"
version = "0.1.0"
description = "An End-to-End automated pipeline that ingest live time series data, generates predictions, and uses an AI agent to evaluate, interpret, and act on those predictions"
readme = "README.md"
requires-python = ">=3.10"
dependencies =[
    "yfinance>=0.2.36",
    "xgboost>=2.0.3",
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.4",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-tavily>=0.2.18",
    "tavily-python>=0.3.2",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
